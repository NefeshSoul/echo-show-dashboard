<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#121724; --panel2:#0e1320;
    --ink:#f2f5f9; --dim:#8b95a7; --faint:#5b6577;
    --accent:#5aa9ff; --warn:#ff7a7a; --ok:#4cd97b; --line:#1d2536;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:26px 52px 18px; border-bottom:1px solid var(--line);
    flex:0 0 auto; position:relative;
  }
  #settingsBtn{
    position:absolute; top:16px; right:16px;
    width:54px; height:54px; border-radius:14px;
    background:transparent; border:1px solid transparent;
    color:var(--faint); font-size:26px; cursor:pointer; opacity:.4;
  }
  #settingsBtn:active{opacity:1; border-color:var(--line)}
  #settingsOverlay{
    position:fixed; inset:0; background:rgba(4,6,10,.74);
    display:flex; align-items:center; justify-content:center; z-index:50;
    padding:24px;
  }
  #settingsOverlay[hidden]{display:none}
  .sheet{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    width:min(700px,94vw); max-height:92vh; overflow-y:auto;
    padding:30px 34px;
  }
  .sheet h2{font-size:26px; margin-bottom:6px}
  .sheet .hint{color:var(--dim); font-size:16px; margin-bottom:20px; line-height:1.55}
  .acct{border:1px solid var(--line); border-radius:14px; padding:18px 20px;
    margin-bottom:16px; background:var(--panel2)}
  .acct h3{font-size:15px; text-transform:uppercase; letter-spacing:2px;
    color:var(--faint); margin-bottom:12px}
  .acct label{display:block; font-size:15px; color:var(--dim); margin-bottom:12px}
  .acct label:last-child{margin-bottom:0}
  .acct input{
    display:block; width:100%; margin-top:6px;
    background:#0a0e16; border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-size:19px; padding:14px 16px;
  }
  .acct input:focus{outline:none; border-color:var(--accent)}
  .sheet .row{display:flex; gap:14px; margin-top:10px}
  .sheet .row button{
    flex:1; padding:16px; font-size:20px; border-radius:12px; border:none;
    background:var(--accent); color:#06121f; font-weight:700; cursor:pointer;
  }
  .sheet .row button.ghost{background:transparent; border:1px solid var(--line);
    color:var(--dim); font-weight:400}
  .clock{font-size:88px; font-weight:200; letter-spacing:3px; line-height:1}
  .clock small{font-size:30px; font-weight:400; color:var(--dim); letter-spacing:1px}
  .dateline{text-align:right}
  .dateline .dow{font-size:34px; font-weight:600}
  .dateline .date{font-size:22px; color:var(--dim); margin-top:4px}
  main{
    flex:1 1 auto; display:grid; grid-template-columns:var(--calpct,50%) 1fr; gap:28px;
    padding:26px 52px; min-height:0;
  }
  section{background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:26px 30px; overflow:hidden; display:flex; flex-direction:column; min-height:0}
  section h2{font-size:20px; text-transform:uppercase; letter-spacing:3px; color:var(--dim);
    margin-bottom:18px; flex:0 0 auto}
  .scroll{overflow-y:auto; flex:1 1 auto; scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  /* Agenda */
  .event{display:flex; gap:18px; padding:15px 6px; border-bottom:1px solid var(--line); align-items:baseline}
  .event:last-child{border-bottom:none}
  .etime{flex:0 0 150px; font-size:22px; color:var(--dim); font-variant-numeric:tabular-nums}
  .event .bar{flex:0 0 5px; align-self:stretch; border-radius:3px; background:#2a3550}
  .event.now .bar{background:var(--accent)}
  .event.now .etime{color:var(--accent); font-weight:700}
  .event.past{opacity:.42}
  .etitle{font-size:27px; font-weight:600}
  .eloc{font-size:19px; color:var(--dim); margin-top:3px}
  .empty{color:var(--faint); font-size:22px; padding:24px 6px}

  /* Tasks */
  .tlist{margin-bottom:22px}
  .tlist h3{font-size:17px; text-transform:uppercase; letter-spacing:2px; color:var(--faint); margin-bottom:10px}
  .task{display:flex; gap:16px; align-items:flex-start; padding:13px 6px; border-bottom:1px solid var(--line); font-size:25px}
  .task:last-child{border-bottom:none}
  .box{flex:0 0 26px; height:26px; border:2px solid var(--faint); border-radius:7px; margin-top:5px}
  .task .t{flex:1 1 auto}
  .due{flex:0 0 auto; font-size:19px; color:var(--dim); margin-top:6px; font-variant-numeric:tabular-nums}
  .due.overdue{color:var(--warn); font-weight:700}
  .due.today{color:var(--accent); font-weight:600}

  footer{
    flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
    padding:12px 52px; border-top:1px solid var(--line);
    font-size:16px; color:var(--faint); letter-spacing:1px;
  }
  .badge{font-size:14px; letter-spacing:2px; padding:5px 14px; border-radius:20px;
    border:1px solid var(--warn); color:var(--warn); display:none}
  body.demo .badge{display:inline-block}

  .sechead{display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; flex:0 0 auto}
  .sechead h2{margin-bottom:0}
  .seg{display:flex; background:#0a0e16; border:1px solid var(--line);
    border-radius:12px; padding:4px; gap:4px}
  .seg button{background:transparent; border:none; color:var(--dim);
    font-size:16px; padding:9px 16px; border-radius:8px; cursor:pointer}
  .seg button.on{background:#26314a; color:var(--ink); font-weight:600}
  .dayhead{font-size:17px; text-transform:uppercase; letter-spacing:2px;
    color:var(--accent); margin:20px 0 4px}
  .dayhead:first-child{margin-top:0}
  #tasks{overflow:hidden; flex:1 1 auto; min-height:0; display:flex}
  .tblocks{display:grid; gap:26px; height:100%; width:100%}
  .tblocks.cols2{grid-template-columns:1fr 1fr}
  .tblock{display:flex; flex-direction:column; min-height:0}
  .accthead{font-size:21px; letter-spacing:2px; text-transform:uppercase;
    color:var(--accent); margin-bottom:12px; flex:0 0 auto}
  .tscroll{flex:1 1 auto; overflow-y:auto; scrollbar-width:none; min-height:0}
  .tscroll::-webkit-scrollbar{display:none}
  .cols2 .task{font-size:22px}
  .weekgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:10px;
    flex:1 1 auto; min-height:0}
  .calwrap{display:flex; flex-direction:column; height:100%; min-height:0}
  .calwrap .callegend{flex:0 0 auto}
  .weekgrid .day{overflow-y:auto; scrollbar-width:none; min-height:0}
  .weekgrid .day::-webkit-scrollbar{display:none}
  .weekgrid .day{background:var(--panel2); border:1px solid var(--line);
    border-radius:12px; padding:10px; overflow:hidden}
  .weekgrid .day.today{border-color:var(--accent)}
  .weekgrid .day h4{display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:6px}
  .weekgrid .day h4 span{font-size:13px; text-transform:uppercase;
    letter-spacing:1px; color:var(--dim)}
  .weekgrid .day h4 b{font-size:22px}
  .weekgrid .day.today h4 b{color:var(--accent)}
  .evt{font-size:14px; line-height:1.35; margin-top:9px; word-break:break-word}
  .evt .t{display:block; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}
  .evt.allday .t{color:var(--accent)}
  .evt.none{color:var(--faint)}

  .toggles{display:flex; gap:26px; margin-top:2px}
  .chk{display:flex; align-items:center; gap:10px; font-size:18px;
    color:var(--dim); cursor:pointer}
  .chk input{width:24px; height:24px; accent-color:var(--accent); cursor:pointer}
  .panel{overflow-y:auto}
  .callegend{display:flex; flex-wrap:wrap; gap:6px 18px; margin-bottom:14px;
    font-size:15px; color:var(--dim); flex:0 0 auto}
  .callegend .cdot{width:11px; height:11px; border-radius:50%;
    display:inline-block; margin-right:7px}
  .evt{border-left:3px solid transparent; padding-left:7px}
  .listchips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; flex:0 0 auto}
  .lchip{font-size:15px; padding:5px 13px; border-radius:20px;
    border:1px solid; white-space:nowrap; background:rgba(255,255,255,.03);
    cursor:pointer; font:inherit; transition:opacity .2s}
  .lchip.off{opacity:.32; filter:grayscale(1)}

  .task{transition:opacity .35s ease}
  .task.done{opacity:0}
  .srow{margin:8px 0 2px}
  .srow .lab{display:flex; justify-content:space-between; font-size:18px;
    color:var(--dim); margin-bottom:2px}
  .srow .lab b{color:var(--ink)}
  input[type=range]{width:100%; accent-color:var(--accent); height:38px; cursor:pointer}

  /* Compact mode: small displays (Echo Show 5 = 960x480). Everything scales
     down; layout and features are unchanged. */
  body.compact header{padding:14px 20px 2px}
  body.compact .clock{font-size:40px}
  body.compact .dateline{font-size:16px}
  body.compact main{gap:14px; padding:12px 18px}
  body.compact section{padding:14px 16px; border-radius:12px}
  body.compact section h2{font-size:13px; letter-spacing:2px; margin-bottom:10px}
  body.compact .sechead{margin-bottom:10px}
  body.compact .seg button{font-size:12px; padding:6px 10px}
  body.compact .event{padding:10px 12px; gap:10px; border-radius:10px}
  body.compact .etime{font-size:15px; min-width:84px}
  body.compact .etitle{font-size:16px}
  body.compact .eloc{font-size:12px}
  body.compact .dayhead{font-size:12px; margin:12px 0 2px; letter-spacing:1px}
  body.compact .task{font-size:15px; padding:9px 10px; gap:10px; border-radius:10px}
  body.compact .box{width:20px; height:20px; border-width:3px; border-radius:6px}
  body.compact .due{font-size:11px; padding:3px 8px}
  body.compact .tlist h3{font-size:13px; margin:12px 0 6px}
  body.compact .lchip{font-size:11px; padding:3px 9px}
  body.compact .listchips{gap:6px; margin-bottom:8px}
  body.compact .accthead{font-size:14px; margin-bottom:8px}
  body.compact .tblocks{gap:14px}
  body.compact .callegend{font-size:11px; gap:4px 10px; margin-bottom:8px}
  body.compact .weekgrid{gap:6px}
  body.compact .weekgrid .day{padding:6px; border-radius:8px}
  body.compact .weekgrid .day h4 span{font-size:10px}
  body.compact .weekgrid .day h4 b{font-size:14px}
  body.compact .evt{font-size:11px; margin-top:6px}
  body.compact .evt .t{font-size:10px}
  body.compact .empty{font-size:14px; padding:16px 0}
  body.compact footer{font-size:12px; padding:8px 18px 10px}
  body.compact #settingsBtn{width:44px; height:44px; font-size:22px; top:12px; right:12px}
  body.compact .demo-badge{font-size:12px; padding:6px 12px; top:12px; left:12px}
  body.compact .panel{padding:22px}

  @media (orientation:portrait){
    main{grid-template-columns:1fr; grid-template-rows:var(--calpct,50%) 1fr}
    .clock{font-size:64px}
  }
</style>
</head>
<body>
<header>
  <div class="clock"><span id="time">--:--</span> <small id="ampm"></small></div>
  <div class="dateline">
    <div class="dow" id="dow">&nbsp;</div>
    <div class="date" id="date">&nbsp;</div>
  </div>
  <button id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
</header>
<main>
  <section>
    <div class="sechead">
      <h2>Calendar</h2>
      <div class="seg" role="radiogroup" aria-label="Calendar view">
        <button type="button" data-view="agenda" class="on">Agenda</button>
        <button type="button" data-view="week">Week</button>
      </div>
    </div>
    <div class="scroll" id="agenda"></div>
  </section>
  <section>
    <h2>Tasks</h2>
    <div id="tasks"></div>
  </section>
</main>
<footer>
  <span id="updated">loading…</span>
  <span class="badge">DEMO DATA</span>
</footer>

<div id="settingsOverlay" hidden>
  <div class="sheet" role="dialog" aria-label="Dashboard settings">
    <h2>Dashboard feeds</h2>
    <p class="hint">Deploy the Apps Script once per Google account (see README),
      then paste each feed URL below. Labels show whose items are whose.</p>
    <div class="acct">
      <h3>Quick setup</h3>
      <label>Setup code<input id="quickCode" placeholder="5-character code" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="16"></label>
      <div class="row">
        <button id="quickLoad" type="button">Load from code</button>
      </div>
      <p class="hint" id="quickStatus" style="margin:12px 0 0" aria-live="polite"></p>
    </div>
    <div class="acct">
      <h3>Echo Show mode</h3>
      <label class="chk"><input type="checkbox" id="showMode"> Keep alive + fullscreen on tap</label>
      <p class="hint" id="uaInfo" style="margin:10px 0 0"></p>
    </div>
    <div class="acct">
      <h3>Account 1</h3>
      <label>Label<input data-f="label" placeholder="e.g. TJ" autocomplete="off"></label>
      <label>Feed URL<input data-f="url" inputmode="url" placeholder="tinyurl code or full URL" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>Secret key <span style="color:var(--faint)">(optional — for completing tasks later)</span><input data-f="key" type="password" placeholder="leave empty for now" autocomplete="off"></label>
      <div class="toggles">
        <label class="chk"><input type="checkbox" data-f="cal" checked> Calendar</label>
        <label class="chk"><input type="checkbox" data-f="tasks" checked> Tasks</label>
      </div>
    </div>
    <div class="acct">
      <h3>Account 2</h3>
      <label>Label<input data-f="label" placeholder="e.g. Sam" autocomplete="off"></label>
      <label>Feed URL<input data-f="url" inputmode="url" placeholder="tinyurl code or full URL" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>Secret key <span style="color:var(--faint)">(optional — for completing tasks later)</span><input data-f="key" type="password" placeholder="leave empty for now" autocomplete="off"></label>
      <div class="toggles">
        <label class="chk"><input type="checkbox" data-f="cal" checked> Calendar</label>
        <label class="chk"><input type="checkbox" data-f="tasks" checked> Tasks</label>
      </div>
    </div>
    <div class="srow">
      <div class="lab"><span>Calendar size</span><b id="calSizeVal">50%</b></div>
      <input type="range" id="calSize" min="20" max="80" step="5" value="50">
    </div>
    <div class="row">
      <button id="saveSettings" type="button">Save</button>
      <button id="cancelSettings" type="button" class="ghost">Cancel</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------
 * DATA: feed URLs live ON THE DEVICE (localStorage), set via the ⚙ panel.
 * An opt-in "<code>.json" quick-setup file may also live in this public
 * repo — anyone who can read the repo can read those URLs/keys, so treat
 * them as public. Supports two accounts; each feed's items are tagged
 * with its label. Without configured feeds it tries ./data.json, then
 * demo data. (Apps Script doesn't send CORS headers, so feeds load via
 * JSONP.)
 * ------------------------------------------------------------------ */
const LOCAL_URL = "data.json";
const REFRESH_MS = 60 * 1000;
const LS_FEEDS = "tb-feeds";
const LS_LEGACY = "tb-data-url"; // migrated from the earlier #fragment mechanism
const LS_SHOWMODE = "tb-showmode"; // manual "this is an Echo Show" override

/* Manual "this is an Echo Show" override, stored per device. */
function getShowModeSetting(){
  try{ return localStorage.getItem(LS_SHOWMODE) === "1"; }catch(e){ return false; }
}
/* True on an Echo Show: auto-detected Silk, or the manual override in ⚙. */
function isShowMode(){
  return IS_SILK || getShowModeSetting();
}

/* Device: Silk's UA contains "Silk/x.y" (Amazon documents the pattern), so the
 * page knows when it's on an Echo Show vs a regular browser. Small screens
 * (e.g. Echo Show 5 at 960x480) get a compact layout; the Show 15 (1920x1080)
 * gets the full one. */
const IS_SILK = /silk/i.test(navigator.userAgent || "");
if (Math.min(window.screen.width, window.screen.height) < 700)
  document.body.classList.add("compact");

function getFeeds(){
  try{
    const raw = localStorage.getItem(LS_FEEDS);
    if (raw){
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) return arr.filter(f => f && f.url);
    }
    const legacy = localStorage.getItem(LS_LEGACY);
    if (legacy){
      const feeds = [{label: "", url: legacy, key: ""}];
      localStorage.setItem(LS_FEEDS, JSON.stringify(feeds));
      localStorage.removeItem(LS_LEGACY);
      return feeds;
    }
  }catch(e){}
  return [];
}
function saveFeeds(feeds){
  try{ localStorage.setItem(LS_FEEDS, JSON.stringify(feeds)); }catch(e){}
}
/* Convenience: typing just the tinyurl code (e.g. "25hv99qa") expands to
 * the full short URL. Full https:// URLs pass through untouched. */
function normalizeFeedUrl(u){
  u = String(u || "").trim();
  if (!u) return u;
  if (!/^https?:\/\//i.test(u)){
    u = "https://tinyurl.com/" + u.replace(/^tinyurl\.com\//i, "");
  }
  return u;
}

function loadJsonp(url){
  return new Promise(function(resolve, reject){
    var cb = "tb_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    var s = document.createElement("script");
    s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cb;
    var done = false;
    var to = setTimeout(function(){ cleanup(); reject(new Error("timeout")); }, 20000);
    function cleanup(){
      if (done) return; done = true;
      clearTimeout(to); delete window[cb]; s.remove();
    }
    window[cb] = function(data){ cleanup(); resolve(data); };
    s.onerror = function(){ cleanup(); reject(new Error("load failed")); };
    document.body.appendChild(s);
  });
}

function dstr(off){
  const d = new Date(); d.setDate(d.getDate() + off);
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
}

const MOCK = {
  feeds: [
    { label: "TJ",
      agenda: [
        { date: dstr(0), start: "07:00", end: "07:45", title: "Morning run", location: "Papago Park", cal: "Personal" },
        { date: dstr(0), start: "18:30", end: "20:00", title: "Dinner", location: "FnB", cal: "Personal" },
        { date: dstr(1), start: "09:00", end: "10:00", title: "Dentist", location: "", cal: "Personal" },
        { date: dstr(3), start: "All day", end: "", title: "Trip to Tucson", location: "", cal: "Family" }
      ],
      taskLists: [
        { name: "Today", tasks: [
          { title: "Review Q4 ad spend report", due: "today" },
          { title: "Water the plants", due: "today" },
          { title: "Book dentist appointment", due: "overdue" }
        ]},
        { name: "This week", tasks: [
          { title: "Draft Nefesh launch notes", due: dstr(4) },
          { title: "Rotate tires", due: dstr(6) }
        ]}
      ] },
    { label: "Kelley",
      agenda: [
        { date: dstr(0), start: "10:30", end: "11:30", title: "Grocery run", location: "Whole Foods", cal: "Personal" },
        { date: dstr(2), start: "12:00", end: "13:00", title: "Lunch with Priya", location: "", cal: "Personal" }
      ],
      taskLists: [
        { name: "Errands", tasks: [
          { title: "Pick up dry cleaning", due: "today" },
          { title: "Buy birthday gift", due: dstr(2) }
        ]}
      ] }
  ]
};

function toMin(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }

function getCalView(){
  try{ return localStorage.getItem("tb-calview") || "agenda"; }catch(e){ return "agenda"; }
}
function getCalSize(){
  try{
    const v = parseInt(localStorage.getItem("tb-calsize") || "50", 10) || 50;
    return Math.min(80, Math.max(20, v));
  }catch(e){ return 50; }
}
function applyCalSize(v){
  document.documentElement.style.setProperty("--calpct", v + "%");
  const lbl = document.getElementById("calSizeVal");
  if (lbl) lbl.textContent = v + "%";
}
function setCalView(v){
  try{ localStorage.setItem("tb-calview", v); }catch(e){}
}

/* Google Calendar's own palette; a name hashes to a stable color. */
const PALETTE = ["#7986cb","#33b679","#8e24aa","#e67c73","#f6bf26","#f4511e",
  "#039be5","#616161","#3f51b5","#0b8043","#d50000","#795548"];
function colorFor(name){
  let h = 0;
  const s = String(name || "?");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
/* Sort order: overdue (-1) < today (0) < dated < undated. */
function dueRank(due){
  if (due === "overdue") return -1;
  if (due === "today") return 0;
  if (due){
    const t = new Date(due + "T12:00:00").getTime();
    return isNaN(t) ? Number.MAX_SAFE_INTEGER : t;
  }
  return Number.MAX_SAFE_INTEGER;
}

function dayLabel(dateStr){
  if (dateStr === dstr(0)) return "Today";
  if (dateStr === dstr(1)) return "Tomorrow";
  return new Date(dateStr + "T12:00:00")
    .toLocaleDateString(undefined, {weekday: "long", month: "short", day: "numeric"});
}

function eventRow(e, isToday, multi){
  const now = nowMin();
  const allDay = !e.end;
  const s = allDay ? -1 : toMin(e.start), en = allDay ? -1 : toMin(e.end);
  const cls = isToday && !allDay && now >= s && now < en ? "now"
            : (isToday && !allDay && now >= en ? "past" : "");
  const sub = (multi && e._acct ? [e._acct] : []).concat([e.cal, e.location])
    .filter(Boolean).join(" · ");
  return `<div class="event ${cls}">
      <div class="etime">${esc(e.start)}${e.end ? "–" + esc(e.end) : ""}</div><div class="bar" style="background:${colorFor(e.cal)}"></div>
      <div><div class="etitle">${esc(e.title)}</div>
      ${sub ? `<div class="eloc">${esc(sub)}</div>` : ""}</div>
    </div>`;
}

function renderCalendar(el, feeds){
  const view = getCalView();
  document.querySelectorAll(".seg button").forEach(b => {
    const on = b.dataset.view === view;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  });
  const calFeeds = feeds.filter(f => f.cal !== false);
  const multi = calFeeds.length > 1;
  const byDay = {};
  calFeeds.forEach(f => (f.agenda || []).forEach(e => {
    const dt = e.date || dstr(0); // old feeds without dates land on today
    (byDay[dt] = byDay[dt] || []).push(Object.assign({}, e, {_acct: f.label}));
  }));
  Object.keys(byDay).forEach(dt => byDay[dt].sort((a, b) => {
    const ad = !a.end, bd = !b.end;
    if (ad && !bd) return -1;
    if (bd && !ad) return 1;
    return a.start < b.start ? -1 : 1;
  }));

  const legend = calLegend(byDay);
  if (view === "week"){
    el.innerHTML = '<div class="calwrap">' + legend + weekHtml(byDay) + "</div>";
    return;
  }

  let html = legend;
  for (let i = 0; i < 7; i++){
    const dt = dstr(i);
    const evs = byDay[dt] || [];
    if (!evs.length && i !== 0) continue;
    html += `<div class="dayhead">${esc(dayLabel(dt))}</div>`;
    html += evs.length
      ? evs.map(e => eventRow(e, i === 0, multi)).join("")
      : `<div class="empty">Nothing scheduled.</div>`;
  }
  el.innerHTML = html || `<div class="empty">Nothing scheduled this week.</div>`;
}

function calLegend(byDay){
  const seen = [];
  Object.keys(byDay).sort().forEach(dt => byDay[dt].forEach(e => {
    if (e.cal && seen.indexOf(e.cal) < 0) seen.push(e.cal);
  }));
  if (seen.length < 2) return "";
  return '<div class="callegend">' + seen.map(c =>
    `<span><span class="cdot" style="background:${colorFor(c)}"></span>${esc(c)}</span>`
  ).join("") + "</div>";
}

function weekHtml(byDay){
  let html = '<div class="weekgrid">';
  for (let i = 0; i < 7; i++){
    const dt = dstr(i);
    const d = new Date(dt + "T12:00:00");
    const evs = byDay[dt] || [];
    html += `<div class="day${i === 0 ? " today" : ""}">` +
      `<h4><span>${esc(d.toLocaleDateString(undefined, {weekday: "short"}))}</span>` +
      `<b>${d.getDate()}</b></h4>` +
      (evs.length ? evs.map(e =>
        `<div class="evt${e.end ? "" : " allday"}" style="border-color:${colorFor(e.cal)}">` +
        (e.end ? `<span class="t">${esc(e.start)}</span>` : `<span class="t">all day</span>`) +
        `<span>${esc(e.title)}</span></div>`
      ).join("") : `<div class="evt none">—</div>`) +
      `</div>`;
  }
  return html + "</div>";
}

function renderTasks(el, feeds){
  const taskFeeds = feeds.filter(f => f.tasks !== false);
  const multi = taskFeeds.length > 1;
  el.innerHTML = '<div class="tblocks' + (multi ? " cols2" : "") + '">' + taskFeeds.map((f, i) =>
    '<div class="tblock" data-feed="' + f.idx + '">' +
    (multi ? '<h3 class="accthead">' + esc(f.label || ("Account " + (i + 1))) + "</h3>" : "") +
    taskChipsHtml(f) +
    '<div class="tscroll">' + taskRowsHtml(f) + "</div></div>"
  ).join("") + "</div>";
}

/* Hidden-list filter: per feed, a set of list names whose tasks are hidden.
 * Survives the 60s refresh and is persisted on the device. */
let hiddenLists = {};
function loadHidden(){
  try{
    const raw = JSON.parse(localStorage.getItem("tb-hidden") || "{}");
    Object.keys(raw).forEach(k => { hiddenLists[k] = new Set(raw[k]); });
  }catch(e){}
}
function saveHidden(){
  try{
    const o = {};
    Object.keys(hiddenLists).forEach(k => { o[k] = Array.from(hiddenLists[k]); });
    localStorage.setItem("tb-hidden", JSON.stringify(o));
  }catch(e){}
}
function toggleList(feedIdx, listName){
  feedIdx = parseInt(feedIdx, 10);
  if (isNaN(feedIdx) || !listName) return;
  if (!hiddenLists[feedIdx]) hiddenLists[feedIdx] = new Set();
  const s = hiddenLists[feedIdx];
  if (s.has(listName)) s.delete(listName); else s.add(listName);
  saveHidden();
  renderTasks(document.getElementById("tasks"), lastFeeds);
}

/* Chips sit above the scrolling task list; tapping one greys it out and
 * hides that list's tasks (tap again to bring them back). */
function taskChipsHtml(f){
  const lists = f.taskLists || [];
  if (!lists.length) return "";
  const hidden = hiddenLists[f.idx] || new Set();
  return '<div class="listchips">' + lists.map(l => {
    const c = colorFor(l.name);
    const off = hidden.has(l.name);
    return `<button type="button" class="lchip${off ? " off" : ""}" data-list="${esc(l.name)}"` +
      ` style="border-color:${c};color:${c}">${esc(l.name)}</button>`;
  }).join("") + "</div>";
}

/* Every visible task in a single list ordered by due date (overdue first),
 * each in its list's color. */
function taskRowsHtml(f){
  const lists = f.taskLists || [];
  const hidden = hiddenLists[f.idx] || new Set();
  const all = [];
  lists.forEach(l => {
    if (hidden.has(l.name)) return;
    (l.tasks || []).forEach(t =>
      all.push({t: t, list: l.name, color: colorFor(l.name),
                listId: t.list || "", id: t.id || ""}));
  });
  all.sort((a, b) => (dueRank(a.t.due) - dueRank(b.t.due)) ||
                     (a.t.title < b.t.title ? -1 : 1));
  if (all.length) return all.map(taskRow).join("");
  const allHidden = lists.length > 0 && lists.every(l => hidden.has(l.name));
  return `<div class="empty">${allHidden ? "Lists hidden — tap a chip to show." : "No open tasks."}</div>`;
}

function taskRow(item){
  const t = item.t, c = item.color;
  const today = new Date(); today.setHours(0,0,0,0);
  let dueLabel = "", dueCls = "";
  if (t.due === "today"){ dueLabel = "today"; dueCls = "today"; }
  else if (t.due === "overdue"){ dueLabel = "overdue"; dueCls = "overdue"; }
  else if (t.due){
    const d = new Date(t.due + "T12:00:00");
    dueLabel = d.toLocaleDateString(undefined, {month: "short", day: "numeric"});
    if (d < today){ dueCls = "overdue"; }
  }
  return `<div class="task" data-list="${esc(item.listId)}" data-id="${esc(item.id)}">` +
    `<div class="box" style="border-color:${c}"></div>` +
    `<div class="t" style="color:${c}">${esc(t.title)}</div>` +
    (dueLabel ? `<div class="due ${dueCls}">${esc(dueLabel)}</div>` : "") + `</div>`;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let lastFeeds = [];

async function load(){
  let feeds = [], demo = false;
  const cfg = getFeeds();
  const failedFeeds = [];
  if (cfg.length){
    const settled = await Promise.all(cfg.map((f, i) =>
      loadJsonp(f.url).then(d => ({feed: f, data: d}))
        .catch(() => { failedFeeds.push(f.label || ("Account " + (i + 1))); return null; })
    ));
    const ok = settled.filter(Boolean);
    if (!ok.length){ demo = true; }
    else feeds = ok.map(function(res, i){
      return {
        label: (res.feed.label || (res.data && res.data.owner) || ("Account " + (i + 1))).trim(),
        agenda: res.data.agenda || [],
        taskLists: res.data.taskLists || [],
        cal: res.feed.cal !== false,
        tasks: res.feed.tasks !== false,
        execUrl: (res.data && res.data.execUrl) || "",
        idx: i
      };
    });
  } else {
    try{
      const r = await fetch(LOCAL_URL, {cache:"no-store"});
      if(!r.ok) throw new Error("http " + r.status);
      const data = await r.json();
      feeds = [{label: "", agenda: data.agenda || [], taskLists: data.taskLists || [],
               cal: true, tasks: true, idx: 0}];
    }catch(e){ demo = true; }
  }
  if (demo) feeds = MOCK.feeds;
  lastFeeds = feeds;
  document.body.classList.toggle("demo", demo);
  renderAll();
  const stamp = "updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const failedMsg = failedFeeds.length
    ? " \u00b7 \u26a0 unreachable: " + failedFeeds.join(", ") : "";
  document.getElementById("updated").textContent = demo
    ? (cfg.length ? stamp + " \u00b7 demo data (feeds unreachable)"
                  : stamp + " \u00b7 demo data \u2014 tap \u2699 to add your feeds")
    : stamp + failedMsg;
}

function renderAll(){
  renderCalendar(document.getElementById("agenda"), lastFeeds);
  renderTasks(document.getElementById("tasks"), lastFeeds);
}

/* Tap-to-complete: ?action=complete goes to the feed's own exec URL, which the
 * feed reports in its payload (short links would drop the query params).
 * The per-account secret key (set in Apps Script properties + here in the
 * settings panel) guards the write endpoint. */
function completeTask(feedIdx, listId, taskId, rowEl){
  const cfg = getFeeds()[feedIdx];
  const feed = lastFeeds[feedIdx] || {};
  if (!cfg || !cfg.key || !listId || !taskId){
    hintFooter("\u2699 \u2192 add a secret key to enable tap-to-complete");
    return;
  }
  rowEl.classList.add("done");
  const base = feed.execUrl || cfg.url;
  loadJsonp(base + (base.indexOf("?") >= 0 ? "&" : "?") +
    "action=complete&listId=" + encodeURIComponent(listId) +
    "&taskId=" + encodeURIComponent(taskId) +
    "&key=" + encodeURIComponent(cfg.key))
  .then(res => {
    if (res && res.ok){
      setTimeout(() => { if (rowEl.parentNode) rowEl.parentNode.removeChild(rowEl); }, 380);
    } else {
      rowEl.classList.remove("done");
      hintFooter("Couldn't complete that task \u2014 try again");
    }
  })
  .catch(() => rowEl.classList.remove("done"));
}

let hintTimer = null;
function hintFooter(msg){
  const el = document.getElementById("updated");
  if (!el) return;
  el.textContent = msg;
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(load, 3500);
}

document.getElementById("tasks").addEventListener("click", function(e){
  const chip = e.target && e.target.closest ? e.target.closest(".lchip") : null;
  if (chip){
    const block = chip.closest ? chip.closest(".tblock") : null;
    if (block) toggleList(block.getAttribute("data-feed"), chip.getAttribute("data-list"));
    return;
  }
  const row = e.target && e.target.closest ? e.target.closest(".task") : null;
  if (!row || row.classList.contains("done")) return;
  const block = row.closest ? row.closest(".tblock") : null;
  const feedIdx = block ? parseInt(block.getAttribute("data-feed"), 10) : NaN;
  if (isNaN(feedIdx)) return;
  completeTask(feedIdx, row.getAttribute("data-list"), row.getAttribute("data-id"), row);
});

document.querySelectorAll(".seg button").forEach(function(b){
  b.addEventListener("click", function(){ setCalView(b.dataset.view); renderAll(); });
});

function tickClock(){
  const d = new Date();
  let h = d.getHours(), ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  document.getElementById("time").textContent =
    h + ":" + String(d.getMinutes()).padStart(2,"0");
  document.getElementById("ampm").textContent = ap;
  document.getElementById("dow").textContent =
    d.toLocaleDateString(undefined, {weekday:"long"});
  document.getElementById("date").textContent =
    d.toLocaleDateString(undefined, {month:"long", day:"numeric", year:"numeric"});
}

tickClock(); setInterval(tickClock, 1000);
applyCalSize(getCalSize());
loadHidden();
load(); setInterval(load, REFRESH_MS);

/* ------------------------------------------------------------------
 * Silk keep-alive (Echo Show): Silk returns to the home screen after a
 * few idle minutes. A muted, looping silent audio track counts as media
 * playback and keeps the page alive. Fully silent.
 * Also requests fullscreen on first tap (needs a user gesture), which
 * hides browser chrome in browsers that honor it.
 * ------------------------------------------------------------------ */
(function silkKeepAlive(){
  if (!isShowMode()) return; /* keep-alive only matters on the Echo Show; pointless on desktop */
  function silentWavURL(seconds, rate){
    seconds = seconds || 2; rate = rate || 8000;
    var n = Math.floor(seconds * rate);
    var buf = new ArrayBuffer(44 + n);
    var v = new DataView(buf);
    function str(o, s){ for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0, "RIFF"); v.setUint32(4, 36 + n, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, "data"); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) v.setUint8(44 + i, 128); /* 8-bit silence */
    return URL.createObjectURL(new Blob([buf], {type: "audio/wav"}));
  }
  function start(){
    try{
      var a = document.createElement("audio");
      a.muted = true; a.loop = true; a.autoplay = true;
      a.setAttribute("playsinline", "");
      a.src = silentWavURL();
      a.style.display = "none";
      document.body.appendChild(a);
      var p = a.play();
      if (p && p.catch) p.catch(function(){
        document.addEventListener("pointerdown", function(){ a.play(); }, {once: true});
      });
    }catch(e){ /* keep-alive is best-effort */ }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
  if (isShowMode()) document.addEventListener("pointerdown", function(){
    try{
      var el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
    }catch(e){}
  });
})();

/* Settings panel: two account feeds (label + URL + optional secret key),
 * stored on the device in localStorage. */
(function settings(){
  var overlay = document.getElementById("settingsOverlay");
  function acctBoxes(){ /* the Quick setup box shares .acct styling but has no feed fields */
    return Array.prototype.filter.call(document.querySelectorAll(".acct"), function(box){
      return !!box.querySelector('[data-f="label"]');
    });
  }
  function fill(){
    var feeds = getFeeds();
    acctBoxes().forEach(function(box, i){
      var f = feeds[i] || {};
      box.querySelector('[data-f="label"]').value = f.label || "";
      box.querySelector('[data-f="url"]').value = f.url || "";
      box.querySelector('[data-f="key"]').value = f.key || "";
      box.querySelector('[data-f="cal"]').checked = f.cal !== false;
      box.querySelector('[data-f="tasks"]').checked = f.tasks !== false;
    });
  }
  document.getElementById("settingsBtn").addEventListener("click", function(){
    fill();
    document.getElementById("calSize").value = getCalSize();
    applyCalSize(getCalSize());
    document.getElementById("showMode").checked = getShowModeSetting();
    document.getElementById("uaInfo").textContent =
      (IS_SILK ? "This browser was detected as Amazon Silk. "
               : "Not detected as Silk — if this is an Echo Show, turn on the toggle above. ") +
      "UA: " + String(navigator.userAgent || "").slice(0, 100);
    overlay.hidden = false;
  });
  document.getElementById("showMode").addEventListener("change", function(e){
    try{ localStorage.setItem(LS_SHOWMODE, e.target.checked ? "1" : "0"); }catch(err){}
    document.getElementById("uaInfo").textContent =
      "Saved — reload the page for Echo Show mode to take effect.";
  });
  document.getElementById("calSize").addEventListener("input", function(e){
    const v = Math.min(80, Math.max(20, parseInt(e.target.value, 10) || 50));
    try{ localStorage.setItem("tb-calsize", String(v)); }catch(err){}
    applyCalSize(v);
  });
  document.getElementById("cancelSettings").addEventListener("click", function(){
    overlay.hidden = true;
  });
  overlay.addEventListener("click", function(e){
    if (e.target === overlay) overlay.hidden = true;
  });
  /* Quick setup: fetch <code>.json from this site, fill the form, save. */
  document.getElementById("quickLoad").addEventListener("click", function(){
    var status = document.getElementById("quickStatus");
    var code = document.getElementById("quickCode").value.replace(/[^A-Za-z0-9]/g, "").slice(0, 32).toLowerCase();
    if (code.length < 3){ status.textContent = "Enter your setup code."; return; }
    status.textContent = "Loading…";
    fetch(code + ".json", {cache: "no-store"}).then(function(r){
      if (!r.ok) throw new Error("not found");
      return r.json();
    }).then(function(data){
      var feeds = ((data && data.feeds) || []).filter(function(f){ return f && f.url; }).slice(0, 2);
      if (!feeds.length) throw new Error("empty");
      acctBoxes().forEach(function(box, i){
        var f = feeds[i] || {};
        box.querySelector('[data-f="label"]').value = f.label || "";
        box.querySelector('[data-f="url"]').value = f.url || "";
        box.querySelector('[data-f="key"]').value = f.key || "";
        box.querySelector('[data-f="cal"]').checked = f.cal !== false;
        box.querySelector('[data-f="tasks"]').checked = f.tasks !== false;
      });
      status.textContent = "Loaded — saving…";
      document.getElementById("saveSettings").click();
    }).catch(function(){
      status.textContent = "Code not found — check it and try again.";
    });
  });
  document.getElementById("saveSettings").addEventListener("click", function(){
    var feeds = [];
    acctBoxes().forEach(function(box){
      var url = normalizeFeedUrl(box.querySelector('[data-f="url"]').value);
      if (!url) return;
      feeds.push({
        label: box.querySelector('[data-f="label"]').value.trim(),
        url: url,
        key: box.querySelector('[data-f="key"]').value.trim(),
        cal: box.querySelector('[data-f="cal"]').checked,
        tasks: box.querySelector('[data-f="tasks"]').checked
      });
    });
    saveFeeds(feeds);
    overlay.hidden = true;
    load();
  });
})();

/* Setup via URL hash: opening the page as .../dashboard/#aqurn configures
 * the feeds from aqurn.json automatically — but only on a fresh device with
 * no feeds saved yet, so it never clobbers an existing setup. */
(function hashSetup(){
  var m = /^#([A-Za-z0-9]{3,32})$/.exec(location.hash || "");
  if (!m) return;
  if (getFeeds().length) return;
  var code = m[1].toLowerCase();
  try{
    if (sessionStorage.getItem("tb-setup-tried") === code) return;
    sessionStorage.setItem("tb-setup-tried", code);
  }catch(e){}
  fetch(code + ".json", {cache: "no-store"}).then(function(r){
    if (!r.ok) throw new Error("not found");
    return r.json();
  }).then(function(data){
    var feeds = ((data && data.feeds) || []).filter(function(f){ return f && f.url; }).slice(0, 2);
    if (!feeds.length) throw new Error("empty");
    saveFeeds(feeds.map(function(f){
      return {
        label: String(f.label || "").trim(),
        url: normalizeFeedUrl(f.url),
        key: String(f.key || "").trim(),
        cal: f.cal !== false,
        tasks: f.tasks !== false
      };
    }));
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    load();
  }).catch(function(){ /* leave the hash; settings panel remains the fallback */ });
})();
